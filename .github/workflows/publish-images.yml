name: Publish container images

# Builds the API, worker and web images and pushes them to GitHub Container
# Registry. GHCR is free for public repositories and needs no account beyond
# GitHub itself — the built-in GITHUB_TOKEN is enough, so there is nothing to
# configure before this runs.
#
# Pull them with:
#   docker pull ghcr.io/<owner>/codelab-api:latest
#   docker pull ghcr.io/<owner>/codelab-worker:latest
#   docker pull ghcr.io/<owner>/codelab-web:latest

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Also build linux/arm64 (slow — emulated)'
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # arm64 has to be emulated on GitHub's x86 runners, and it pushed a single
      # image past an hour. Build it only for tagged releases or on request, so
      # ordinary pushes stay fast; amd64 covers every mainstream cloud host.
      - name: Select platforms
        id: platforms
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ inputs.arm64 }}" = "true" ]; then
            echo 'value=linux/amd64,linux/arm64' >> "$GITHUB_OUTPUT"
          else
            echo 'value=linux/amd64' >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: contains(steps.platforms.outputs.value, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/codelab-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ steps.platforms.outputs.value }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The browser bundle bakes these in at build time. Override them in
          # repository variables once the API has a public URL.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
