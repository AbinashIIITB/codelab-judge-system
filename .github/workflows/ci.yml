name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Lint
        run: npm run lint

      # Every seeded test case is checked against that problem's official
      # solution. A bad expected-output silently marks correct submissions
      # wrong, which is invisible until someone tries to solve the problem.
      - name: Validate seeded test data
        run: node scripts/validate-seed.mjs
