# CodeLab — full local/self-hosted stack.
#
#   docker compose up -d                     # Docker-sandbox execution (default)
#   docker compose --profile piston up -d    # also run a private Piston instance
#
# Set EXECUTOR_TYPE=piston together with the piston profile to judge through
# Piston instead of spawning a container per test case. The public emkc.org
# instance is whitelist-only since 2026-02-15 and cannot be used.

services:
  mongodb:
    image: mongo:7
    container_name: codelab-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codelab
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  redis:
    image: redis:7-alpine
    container_name: codelab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  # Private Piston instance. Only started with `--profile piston`.
  # Needs privileged mode because it isolates each run itself.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: codelab-piston
    profiles: ["piston"]
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston
    networks:
      - codelab-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codelab-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/codelab
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      # Guards the hidden test case endpoint. Must match the worker's value.
      - WORKER_API_KEY=${WORKER_API_KEY:-dev-worker-key}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: codelab-worker
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/codelab
      - REDIS_URL=redis://redis:6379
      - API_WS_URL=http://api:4000
      - WORKER_API_KEY=${WORKER_API_KEY:-dev-worker-key}
      # "docker" spawns a sandbox container per test case; "piston" calls the
      # Piston service above.
      - EXECUTOR_TYPE=${EXECUTOR_TYPE:-docker}
      - PISTON_URL=${PISTON_URL:-http://piston:2000/api/v2/execute}
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      # Host Docker socket, so the worker can start sibling sandbox containers.
      # Override DOCKER_SOCK for OrbStack/Colima/Podman, e.g.
      #   DOCKER_SOCK=$HOME/.orbstack/run/docker.sock docker compose up -d
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - codelab-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined into the client bundle at build time; setting it
      # under `environment` has no effect on the browser.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    container_name: codelab-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    networks:
      - codelab-network

volumes:
  mongodb_data:
  redis_data:
  piston_data:

networks:
  codelab-network:
    driver: bridge
