services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: codelab-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=codelab
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: codelab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  # API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codelab-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/codelab
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:3000
      # Shared secret: guards the hidden test case endpoint and authenticates the
      # worker's status relay. Must match the worker's value.
      - WORKER_API_KEY=${WORKER_API_KEY:-dev-worker-key}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codelab-network

  # Worker Service
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: codelab-worker
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/codelab
      - REDIS_URL=redis://redis:6379
      - API_WS_URL=http://api:4000
      - DOCKER_HOST=unix:///var/run/docker.sock
      - WORKER_API_KEY=${WORKER_API_KEY:-dev-worker-key}
    volumes:
      # The worker sandboxes each submission in a sibling container.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - codelab-network

  # Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it must
      # be a build arg — setting it under `environment` has no effect on the browser.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000}
    container_name: codelab-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - api
    networks:
      - codelab-network

volumes:
  mongodb_data:
  redis_data:

networks:
  codelab-network:
    driver: bridge
